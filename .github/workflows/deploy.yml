name: Deploy Automático para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes Unitários Críticos
        run: npm run test:run

      - name: Compilar Artefatos Estáticos
        run: npm run build
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'

      - name: Garantir compatibilidade com GitHub Pages (.nojekyll)
        run: touch ./dist/.nojekyll

      # ── Método 1: GitHub Actions Pages Moderno (com auto-ativação) ──
      - name: Configurar Páginas (com auto-ativação)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload do Artefato Compilado (Actions)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
        continue-on-error: true

      - name: Publicar via GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # ── Método 2: Deploy Garantido na branch gh-pages (Fallback Universal) ──
      - name: Publicar para branch gh-pages (Fallback Universal)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
