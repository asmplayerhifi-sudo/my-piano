<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Harmonia — Redirecionando...</title>
    <script>
      // Redirecionamento SPA para GitHub Pages mantendo rotas e hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var newPath = '/' + repoName + '/#/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      if (l.search) newPath += l.search;
      if (l.hash) newPath += (l.hash.startsWith('#/') ? '' : '#/') + l.hash.slice(1);
      window.location.replace(newPath);
    </script>
  </head>
  <body style="background:#080811;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecionando para a aplicação musical...</p>
  </body>
</html>
